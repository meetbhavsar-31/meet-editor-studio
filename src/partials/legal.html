<template id="tpl-privacy">
<h2>Privacy Policy</h2><p>Last updated: {{legal:updated}}</p>
<h3>What this site stores</h3><p>This site has no accounts and no database. The contact form opens your own email app, and nothing is sent until you press send there.</p>
<h3>What you send me</h3><p>If you email or message me, I receive your name, email address and project details. I use them only to reply and to deliver your project.</p>
<h3>Theme choice</h3><p>Your chosen color theme is saved in your browser (local storage) on your device. It is not sent anywhere.</p>
<h3>Third-party services</h3>
<ul><li>YouTube: video cover images load from YouTube when the page opens. The player loads only when you press play, using YouTube's privacy-enhanced mode. Google may set cookies once a video plays.</li>
<li>Google Fonts: the site's fonts load from Google.</li>
<li>Netlify: hosts this site and may keep standard server logs, such as IP addresses.</li>
<li>Instagram and other links: these open in a new tab and follow their own privacy policies.</li></ul>
<h3>Likes</h3><p>When you press the heart, a random anonymous ID (not your name or email) is saved in your browser and stored with your like on the server (Netlify). This lets each person like an item once and lets the total be shown to everyone. Press the heart again to remove your like.</p>
<h3>Visit statistics</h3><p>The site counts visits in a privacy-friendly way: page name, device type, country and where you came from, as daily totals. No cookies, no IP address and nothing that identifies you is stored. If your browser sends “Do Not Track”, nothing is counted.</p>
<h3>Comments</h3><p>If you leave a comment, the name and text you type are stored on the server and shown after approval. Do not share personal details in comments. Ask me by email to remove one.</p>
<h3>Sharing</h3><p>I never sell your information. I share it only when needed to deliver the project.</p>
<h3>Your choices</h3><p>To have your messages deleted, email {{email}}.</p>
<h3>Changes</h3><p>I may update this policy. The date above shows the latest version.</p>
</template>
